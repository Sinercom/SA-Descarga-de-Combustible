<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=Planilla%20Control%20de%20Descarga%20Camión%20San%20Agustín%20online.html" />
    <title>SA - Descarga de Combustible</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #22c55e;
        --text: #e5e7eb;
        --muted: #cbd5e1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020817, #111827 50%, #0f172a);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(90vw, 860px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        padding: 40px 30px;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 3vw, 3rem);
      }
      p {
        margin: 0 auto 22px;
        max-width: 640px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }
      .btn {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 12px;
        background: var(--primary);
        color: #052e16;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        transition: transform 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .small {
        margin-top: 16px;
        display: block;
        color: #94a3b8;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SA - Descarga de Combustible</h1>
      <p>
        Sistema de control y registro para la descarga de combustible.
        Redirigiendo a la planilla principal...
      </p>
      <a class="btn" href="Planilla%20Control%20de%20Descarga%20Camión%20San%20Agustín%20online.html">
        Abrir planilla
      </a>
      <span class="small">Publicado con GitHub Pages</span>
    </main>
  </body>
</html>
