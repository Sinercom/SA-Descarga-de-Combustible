<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SA - Descarga de Combustible</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        max-width: 720px;
      }
      h1 {
        margin-bottom: 12px;
        font-size: 2.2rem;
      }
      p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #cbd5e1;
      }
      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 14px;
        background: #22c55e;
        color: #052e16;
        border-radius: 999px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SA - Descarga de Combustible</h1>
      <p>Repositorio inicial para la aplicación o proyecto relacionado con la descarga de combustible.</p>
      <div class="badge">Index creado</div>
    </div>
  </body>
</html>
